# /etc/pve-updater/pve-updater.conf
# Sourced as bash. Booleans are the literal words true / false.

# ---------------------------------------------------------------- what to do
UPDATE_HOST=true              # apt-get update && dist-upgrade on the PVE node
UPDATE_GUESTS=true            # walk every LXC container
UPDATE_PACKAGES=true          # OS packages inside the guests
UPDATE_DOCKER=true            # docker compose pull && up -d

# ------------------------------------------------------------ which containers
# Container IDs to leave alone, space separated. Anything stateful that you do
# not want restarting unattended in the middle of the night belongs here.
EXCLUDE_CTIDS=()

# Start stopped containers, update them, then stop them again.
INCLUDE_STOPPED=false
POST_START_WAIT=15            # seconds to let the network come up after a start

# --------------------------------------------------------------- safety net
# Requires a snapshot-capable storage (ZFS, LVM-thin, or qcow2 on a directory)
# and no bind mounts on the container.
SNAPSHOT_BEFORE_UPDATE=false
SNAPSHOT_KEEP=2               # automatic snapshots kept per container

# ------------------------------------------------------------------- docker
DOCKER_PRUNE=true             # remove dangling images after the pull
DOCKER_PRUNE_ALL=false        # also remove every image no container uses
DISCOVER_COMPOSE_FILES=true   # report compose files found on disk
ADOPT_ORPHAN_STACKS=false     # ...and pull/start them too. Off on purpose:
                              # it would start stacks you deliberately stopped.

# ------------------------------------------------------------------ reports
REPORT_RETENTION=40           # runs kept in the dashboard

# ------------------------------------------------------------------ reboots
# The node picks up a new kernel only after a reboot. Left to you by default.
REBOOT_HOST_IF_REQUIRED=false

# ------------------------------------------------------------ notifications
# ntfy: NTFY_URL="https://ntfy.sh/my-private-topic"
NTFY_URL=""
NTFY_TOKEN=""
# Any endpoint that accepts {"title","text","run_id"} as JSON
WEBHOOK_URL=""

# ------------------------------------------------------------------- monitor
# Provision btop + ttyd in each running container and publish a live
# "Monitor" tab on the dashboard. OFF by default: unlike the updater, this
# installs packages (btop, ttyd, tmux) inside your guests. Excluded
# containers are not touched.
BTOP_MONITOR=false
BTOP_PORT=7681               # per-container ttyd port serving the btop view
