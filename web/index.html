<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>pve-updater</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">pve<span>&middot;</span>updater</div>
    <nav role="tablist" id="tabs"></nav>
    <div class="actions">
      <span class="pulse" id="pulse"></span>
      <div class="menu">
        <button class="primary" id="runbtn">Run update<span class="caret"></span></button>
        <div id="runmenu" hidden></div>
      </div>
      <button class="ghost icon" id="keybtn" aria-label="Access key" title="Access key">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21"/>
          <path d="M17.5 12v3"/><path d="M20 12v2.5"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="main"></main>
<div id="console"></div>
<div id="modal"></div>

<script src="app.js"></script>
</body>
</html>
